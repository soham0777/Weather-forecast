# Render Blueprint (optional). Creates the API (Docker) and the React static site.
# The MySQL database is external (e.g. Aiven for MySQL or Railway MySQL) because Render
# does not offer managed MySQL. See docs/DEPLOYMENT.md for the full walkthrough.
services:
  - type: web
    name: cims-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false          # jdbc:mysql://<host>:<port>/<db>?sslMode=REQUIRED&serverTimezone=UTC
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # https://<your-frontend-domain>
      - key: FRONTEND_URL
        sync: false          # https://<your-frontend-domain>
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: FILE_STORAGE_PATH
        value: /var/data/uploads
      - key: MAIL_ENABLED
        value: "false"
    # Uploaded resumes must survive restarts; persistent disks need a paid Render plan.
    disk:
      name: cims-uploads
      mountPath: /var/data/uploads
      sizeGB: 1

  - type: web
    name: cims-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # https://<cims-api-domain>/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
